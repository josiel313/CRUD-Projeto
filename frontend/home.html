<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Home</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            background: #fff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            text-align: center;
            width: 350px;
        }

        h1 {
            color: #333;
            margin-bottom: 20px;
        }

        p {
            margin-bottom: 20px;
            color: #555;
        }

        button {
            padding: 10px 20px;
            background: #dc3545;
            color: #fff;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        button:hover {
            background: #c82333;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Bem-vindo ao sistema!</h1>
        <p>Login efetuado com sucesso.</p>
        <button onclick="logout()">Sair</button>
    </div>

    <script>
        function logout() {
            // redireciona para a página de login
            window.location.href = "login.html";
        }
    </script>
</body>

</html>
